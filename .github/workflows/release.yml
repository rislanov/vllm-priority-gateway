name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate release tag format
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "tag must be a stable SemVer tag such as v1.2.3" >&2
            exit 1
          fi

          version="${TAG#v}"
          IFS=. read -r major minor _patch <<< "$version"
          {
            echo "version=$version"
            echo "minor=$major.$minor"
            echo "major=$major"
          } >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag source
        id: source
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force --prune --prune-tags --tags origin
          git fetch --no-tags origin main:refs/remotes/origin/main

          tag_commit="$(git rev-list -n 1 "$TAG")"
          checkout_commit="$(git rev-parse HEAD)"
          if [[ "$checkout_commit" != "$tag_commit" ]]; then
            echo "checked out commit does not match $TAG" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "$TAG must point to a commit reachable from main" >&2
            exit 1
          fi

          latest_stable_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              latest_stable_tag="$candidate"
              break
            fi
          done < <(git tag --merged origin/main --list 'v*' --sort=-version:refname)
          if [[ "$TAG" != "$latest_stable_tag" ]]; then
            echo "$TAG is not the newest stable SemVer tag ($latest_stable_tag)" >&2
            exit 1
          fi

          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Inspect existing release state
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          releases="$(mktemp)"
          trap 'rm -f "$releases"' EXIT

          gh api --paginate --slurp \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"

          match_count="$(jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | length' "$releases")"
          if [[ "$match_count" == "0" ]]; then
            echo "state=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$match_count" != "1" ]]; then
            echo "expected at most one release for $TAG, found $match_count" >&2
            exit 1
          fi

          is_draft="$(jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) | .draft' "$releases")"
          if [[ "$is_draft" != "true" ]]; then
            echo "published GitHub Release $TAG already exists" >&2
            exit 1
          fi

          target="$(jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) | .target_commitish' "$releases")"
          if [[ "$target" != "$SOURCE_COMMIT" ]]; then
            echo "draft release $TAG targets $target instead of $SOURCE_COMMIT" >&2
            exit 1
          fi

          amd64_asset="vllm-priority-gateway_${VERSION}_linux_amd64.tar.gz"
          arm64_asset="vllm-priority-gateway_${VERSION}_linux_arm64.tar.gz"
          unexpected_assets="$(jq -r \
            --arg tag "$TAG" \
            --arg amd64 "$amd64_asset" \
            --arg arm64 "$arm64_asset" \
            '[.[][] | select(.tag_name == $tag) | .assets[].name | select(. != $amd64 and . != $arm64 and . != "SHA256SUMS")] | join(", ")' \
            "$releases")"
          if [[ -n "$unexpected_assets" ]]; then
            echo "draft release contains unexpected assets: $unexpected_assets" >&2
            exit 1
          fi

          echo "state=draft" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -count=1 ./cmd/... ./internal/...

      - name: Run go vet
        run: go vet ./...

      - name: Build release assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/staging

          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" \
              -o dist/staging/gateway ./cmd/gateway
            tar -C dist/staging -czf \
              "dist/vllm-priority-gateway_${VERSION}_linux_${arch}.tar.gz" \
              gateway
          done

          rm -rf dist/staging
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)

      - name: Set image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check exact image tag state
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          RELEASE_STATE: ${{ steps.release.outputs.state }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          set +e
          inspect_output="$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1)"
          inspect_status=$?
          set -e

          if [[ "$inspect_status" == "0" ]]; then
            if [[ "$RELEASE_STATE" != "draft" ]]; then
              echo "image $IMAGE:$VERSION already exists without a matching draft release" >&2
              exit 1
            fi
            echo "resuming draft release with existing image $IMAGE:$VERSION"
          elif grep -Eqi 'manifest unknown|name unknown|not found' <<< "$inspect_output"; then
            echo "image $IMAGE:$VERSION does not exist yet"
          else
            echo "$inspect_output" >&2
            echo "could not determine whether $IMAGE:$VERSION exists" >&2
            exit 1
          fi

      - name: Create or refresh draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_STATE: ${{ steps.release.outputs.state }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_STATE" == "absent" ]]; then
            gh release create "$TAG" \
              dist/*.tar.gz dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target "$SOURCE_COMMIT" \
              --generate-notes \
              --title "$TAG" \
              --draft
          else
            gh release upload "$TAG" \
              dist/*.tar.gz dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          fi

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Verify remote tag before image publication
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_object=""
          remote_commit=""
          while read -r commit ref; do
            if [[ "$ref" == *'^{}' ]]; then
              remote_commit="$commit"
            else
              tag_object="$commit"
            fi
          done < <(git ls-remote --tags origin \
            "refs/tags/$TAG" "refs/tags/${TAG}^{}")

          if [[ -z "$remote_commit" ]]; then
            remote_commit="$tag_object"
          fi
          if [[ -z "$remote_commit" || "$remote_commit" != "$SOURCE_COMMIT" ]]; then
            echo "remote tag $TAG moved or disappeared during publication" >&2
            exit 1
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify remote tag before release publication
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_object=""
          remote_commit=""
          while read -r commit ref; do
            if [[ "$ref" == *'^{}' ]]; then
              remote_commit="$commit"
            else
              tag_object="$commit"
            fi
          done < <(git ls-remote --tags origin \
            "refs/tags/$TAG" "refs/tags/${TAG}^{}")

          if [[ -z "$remote_commit" ]]; then
            remote_commit="$tag_object"
          fi
          if [[ -z "$remote_commit" || "$remote_commit" != "$SOURCE_COMMIT" ]]; then
            echo "remote tag $TAG moved or disappeared during publication" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft=false \
            --latest
